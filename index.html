<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Christian's Color Tool</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    
    <button id="themeToggle">🌙</button>

    <h1><i>Christian's Color Tool</i></h1>

    <div class="container">
        <label><b>Select your color:</b></label>
        <input type="color" id="colorPicker">

        <label><b>HEX Code:</b></label>
        <input type="text" id="hexInput" placeholder="#ff0000">

        <label><b>RGB:</b></label>
        <input type="number" id="rInput" placeholder="R" min="0" max="255">
        <input type="number" id="gInput" placeholder="G" min="0" max="255">
        <input type="number" id="bInput" placeholder="B" min="0" max="255">

        <button id="randomBtn"><b><i>Random Color</i></b></button>

        <div id="colorBox"></div>

        <h3><i>Generated Palette:</i></h3>
        <div id="palette"></div>
    </div>

    <script src="script.js"></script>
    <div id="bottomGradient"></div>
</body>
</html>
